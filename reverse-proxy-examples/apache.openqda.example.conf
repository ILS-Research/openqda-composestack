# Example Apache reverse proxy for the OpenQDA Docker setup.
#
# Replace the placeholders:
#   openqda.example.org   public host name
#   /etc/letsencrypt/...  your TLS certificate files
#   8923 / 8443           APP_PORT / REVERB_PORT from your .env
#
# Required modules:
#   a2enmod ssl proxy proxy_http proxy_wstunnel headers rewrite
#
# Matching .env settings (TLS is terminated here, containers speak plain HTTP):
#   APP_URL=https://openqda.example.org
#   FORCE_HTTPS=true
#   TRUSTED_PROXIES=127.0.0.1
#   VITE_REVERB_HOST=openqda.example.org
#   VITE_REVERB_PORT=443
#   VITE_REVERB_SCHEME=https

<VirtualHost *:443>
    ServerName openqda.example.org
    # ServerAlias www.openqda.example.org

    # --- SSL ---
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/openqda.example.org/cert.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/openqda.example.org/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/openqda.example.org/fullchain.pem

    # For local testing only: use the self-signed example certificates instead
    # (adjust the absolute path to where you cloned this repository).
    # SSLCertificateFile      /path/to/openqda/reverse-proxy-examples/certs/cert.example.pem
    # SSLCertificateKeyFile   /path/to/openqda/reverse-proxy-examples/certs/privkey.example.pem
    # SSLCertificateChainFile /path/to/openqda/reverse-proxy-examples/certs/fullchain.example.pem

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    RequestHeader set X-Forwarded-Ssl   "on"

    # WebSocket proxy for Reverb (use ws://, not wss://: TLS ends at this proxy).
    # Must come before the catch-all "/" rule.
    ProxyPass        /app/ ws://127.0.0.1:8443/app/ retry=0
    ProxyPassReverse /app/ ws://127.0.0.1:8443/app/

    # HTTP traffic to the OpenQDA container
    ProxyPass        / http://127.0.0.1:8923/ retry=0
    ProxyPassReverse / http://127.0.0.1:8923/

    ErrorLog  ${APACHE_LOG_DIR}/openqda-443-error.log
    CustomLog ${APACHE_LOG_DIR}/openqda-443-access.log combined
</VirtualHost>

# Redirect all plain HTTP traffic to HTTPS
<VirtualHost *:80>
    ServerName openqda.example.org

    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/openqda-80-error.log
    CustomLog ${APACHE_LOG_DIR}/openqda-80-access.log combined
</VirtualHost>
